# Publication de la maquette sur GitHub Pages.
name: Publier la maquette

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true active GitHub Pages sur le depot si ce n'est pas
      # deja fait, sans passer par les reglages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Le depot est publie tel quel : aucune compilation, aucune dependance.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploiement
        uses: actions/deploy-pages@v4
